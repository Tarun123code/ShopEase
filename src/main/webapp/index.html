
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f3f4f6;
            color: #333;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            background-color: #1f2937;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .brand {
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        nav .nav-links {
            display: flex;
            gap: 25px;
        }

        nav .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav .nav-links a:hover {
            color: #fbbf24;
        }

        /* Main Section */
        .main-container {
            min-height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        /* Login Card */
        .login-card {
            background-color: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background-color: #dbeafe;
            color: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .login-header h1 {
            margin: 0 0 10px;
            font-size: 27px;
            color: #1f2937;
        }

        .login-header p {
            margin: 0;
            font-size: 14px;
            color: #6b7280;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Login Button */
        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 7px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-button:hover {
            background-color: #1d4ed8;
        }

        .login-footer {
            margin-top: 22px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {
            nav {
                padding: 16px;
            }

            nav .brand {
                font-size: 19px;
            }

            nav .nav-links {
                gap: 12px;
            }

            nav .nav-links a {
                font-size: 13px;
            }

            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="login" class="brand">ShopEase</a>

        <div class="nav-links">
            <a href="index.html">Login</a>
        </div>
    </nav>

    <!-- Login Section -->
    <div class="main-container">

        <div class="login-card">

            <div class="login-header">
                <div class="login-icon">&#128100;</div>
                <h1>Welcome Back!</h1>
                <p>Please login to your ShopEase account.</p>
            </div>

            <form action="login" method="post">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

            <div class="login-footer">
                Welcome to ShopEase — your shopping destination.
            </div>

        </div>

    </div>

</body>
</html>
